services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notekeeper-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Academia@2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - notekeeper-sqlserver-data:/var/opt/mssql

volumes:
  notekeeper-sqlserver-data:
