name: Deploy da API - Azure App Service + Azure SQL

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.x"
  SOLUTION_FILE: server/NoteKeeper.slnx
  API_PROJECT: server/src/Api/NoteKeeper.Api.csproj
  INFRA_PROJECT: server/src/Infraestrutura/NoteKeeper.Infraestrutura.csproj

jobs:
  # 1. Testes automatizados (bloqueiam o restante se falharem)
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Test
        run: dotnet test "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore

  # 2. Publicação do pacote da API
  build:
    name: Build e Publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  # 3. Migrations no Azure SQL
  migrate:
    name: Migrations Azure SQL
    runs-on: ubuntu-latest
    needs: build
    env:
      ConnectionStrings__SqlServer: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validar connection string
        run: |
          if [ -z "${ConnectionStrings__SqlServer}" ]; then
            echo "O secret AZURE_SQL_CONNECTION_STRING não foi configurado."
            exit 1
          fi

      - name: Restaurar ferramentas (dotnet-ef)
        run: dotnet tool restore --tool-manifest server/dotnet-tools.json

      - name: Aplicar migrations
        run: >
          dotnet ef database update
          --project "${{ env.INFRA_PROJECT }}"
          --startup-project "${{ env.API_PROJECT }}"
          --configuration Release

  # 4. Configuração do App Service e deploy
  deploy:
    name: Configurar Azure e Deploy
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar App Settings
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LUCKYPENNY_LICENSE_KEY: ${{ secrets.LUCKYPENNY_LICENSE_KEY }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
        run: |
          settings=(
            "ConnectionStrings__SqlServer=${AZURE_SQL_CONNECTION_STRING}"
            "Jwt__SigningKey=${JWT_SIGNING_KEY}"
            "Jwt__Issuer=notekeeper-api"
            "Jwt__Audience=notekeeper-client"
            "LuckyPenny__LicenseKey=${LUCKYPENNY_LICENSE_KEY}"
          )

          # Origem do client (Static Web Apps) liberada no CORS da API, sem barra no final.
          if [ -n "${CLIENT_URL}" ]; then
            settings+=("Cors__AllowedOrigins__0=${CLIENT_URL%/}")
          fi

          az webapp config appsettings set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --settings "${settings[@]}" \
            --output none

      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
