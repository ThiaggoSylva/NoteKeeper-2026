name: Build and deploy ASP.NET Core app to Azure Web App - notekeeper-2026

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.x"
  SOLUTION_FILE: "server/NoteKeeper.slnx"
  API_PROJECT: "server/src/Api/NoteKeeper.Api.csproj"
  # Nome do Azure App Service (Web App) criado para o projeto.
  APP_NAME: "notekeeper-2026"
  # Nome (sem .database.windows.net) do servidor Azure SQL, usado para liberar o IP do runner nas migrations.
  SQL_SERVER_NAME: "notekkeprdb"

jobs:
  # 1. Testes automatizados
  test:
    name: Testes
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verificar solução
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.SOLUTION_FILE }}")) {
            Get-ChildItem -Path . -Recurse -Include *.sln,*.slnx,*.csproj |
              Select-Object -ExpandProperty FullName
            throw "Solução não encontrada: ${{ env.SOLUTION_FILE }}"
          }

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Test
        run: >
          dotnet test "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore

  # 2. Compilação e publicação (API + Angular no mesmo pacote)
  build:
    name: Build e Publish
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do Angular
        working-directory: client
        run: npm ci

      - name: Compilar Angular
        working-directory: client
        run: npm run build -- --configuration production

      - name: Build solution
        run: >
          dotnet build "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-restore

      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore
          --output ./publish

      - name: Copiar Angular para wwwroot
        shell: pwsh
        run: |
          $frontendPath = Join-Path $env:GITHUB_WORKSPACE "client/dist/notekeeper/browser"
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"
          $wwwrootPath = Join-Path $publishPath "wwwroot"

          $indexPath = Join-Path $frontendPath "index.html"

          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "Angular não compilado. index.html esperado em: $indexPath"
          }

          # Remove eventual arquivo chamado wwwroot criado pelo publish.
          if (Test-Path -LiteralPath $wwwrootPath -PathType Leaf) {
            Remove-Item -LiteralPath $wwwrootPath -Force
          }

          New-Item -ItemType Directory -Path $wwwrootPath -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $frontendPath "*") `
            -Destination $wwwrootPath `
            -Recurse `
            -Force

          if (-not (Test-Path -LiteralPath (Join-Path $wwwrootPath "index.html") -PathType Leaf)) {
            throw "A cópia do Angular falhou: index.html ausente em $wwwrootPath"
          }

          Write-Host "Angular copiado para $wwwrootPath"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  # 3. Migrações do SQL Server
  migrate:
    name: Migrations SQL Server
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    env:
      ConnectionStrings__SqlServer: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validar connection string
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__SqlServer)) {
            throw "O secret AZURE_SQL_CONNECTION_STRING não foi configurado."
          }

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Libera só o IP deste runner no firewall do Azure SQL durante as migrations.
      # Exige "Acesso à rede pública" habilitado no servidor (Selected networks).
      - name: Liberar IP do runner no Azure SQL
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
          Write-Host "IP do runner: $ip"

          az sql server firewall-rule create `
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            --server "${{ env.SQL_SERVER_NAME }}" `
            --name "github-runner-${{ github.run_id }}" `
            --start-ip-address $ip `
            --end-ip-address $ip `
            --output none

          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a regra de firewall do Azure SQL." }

          # A regra leva alguns segundos para valer.
          Start-Sleep -Seconds 30

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      # O dotnet-ef é uma ferramenta local (server/dotnet-tools.json): restore e execução
      # precisam acontecer dentro de server/ para o manifesto ser encontrado.
      - name: Restaurar Entity Framework CLI
        working-directory: server
        run: dotnet tool restore

      - name: Build API
        run: >
          dotnet build "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore

      - name: Apply EF Core migrations
        working-directory: server
        run: >
          dotnet ef database update
          --project src/Infraestrutura/NoteKeeper.Infraestrutura.csproj
          --startup-project src/Api/NoteKeeper.Api.csproj
          --configuration Release
          --no-build

      - name: Remover IP do runner do Azure SQL
        if: always()
        shell: pwsh
        run: |
          az sql server firewall-rule delete `
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            --server "${{ env.SQL_SERVER_NAME }}" `
            --name "github-runner-${{ github.run_id }}" `
            --output none

  # 4. Configuração do Azure e deploy
  deploy:
    name: Configurar Azure e Deploy
    runs-on: windows-latest
    needs:
      - build
      - migrate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure App Settings
        shell: pwsh
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LUCKYPENNY_LICENSE_KEY: ${{ secrets.LUCKYPENNY_LICENSE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
            throw "AZURE_SQL_CONNECTION_STRING não foi configurado."
          }

          if ([string]::IsNullOrWhiteSpace($env:JWT_SIGNING_KEY)) {
            throw "JWT_SIGNING_KEY não foi configurado."
          }

          # API e Angular rodam na mesma origem (wwwroot), então não é preciso configurar CORS.
          $settings = @{
            "ConnectionStrings__SqlServer" = $env:AZURE_SQL_CONNECTION_STRING
            "Jwt__SigningKey"              = $env:JWT_SIGNING_KEY
            "Jwt__Issuer"                  = "notekeeper-api"
            "Jwt__Audience"                = "notekeeper-client"
            "LuckyPenny__LicenseKey"       = $env:LUCKYPENNY_LICENSE_KEY
          }

          $settingsFile = Join-Path $env:RUNNER_TEMP "azure-appsettings.json"

          try {
            $settings |
              ConvertTo-Json |
              Set-Content -Path $settingsFile -Encoding utf8

            az webapp config appsettings set `
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
              --name "${{ env.APP_NAME }}" `
              --settings "@$settingsFile" `
              --output none

            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao configurar as variáveis do Azure App Service."
            }
          }
          finally {
            Remove-Item $settingsFile -Force -ErrorAction SilentlyContinue
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ./publish
