name: Deploy do client - Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-client-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build e deploy do client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Apontar o client para a API publicada
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "A variável API_URL não foi configurada (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

          printf "export const environment = {\n  urlApi: '%s',\n};\n" "${API_URL%/}" > client/src/environments/environment.ts
          cat client/src/environments/environment.ts

      - name: Instalar dependências
        working-directory: client
        run: npm ci

      - name: Compilar (produção)
        working-directory: client
        run: npm run build -- --configuration production

      - name: Publicar no Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist/notekeeper/browser
          api_location: ""
          skip_app_build: true
          skip_api_build: true
