<main class="grid min-h-dvh lg:grid-cols-[1.05fr_1fr]">
  <section
    class="relative hidden overflow-hidden bg-gradient-to-br from-orchid-700 via-orchid-600 to-orchid-800 p-12 text-white lg:flex lg:flex-col lg:justify-between"
    aria-hidden="true"
  >
    <div
      class="pointer-events-none absolute -top-24 -right-24 size-96 rounded-full bg-note-lilac/20 blur-3xl"
    ></div>
    <div
      class="pointer-events-none absolute -bottom-32 -left-16 size-96 rounded-full bg-note-peach/25 blur-3xl"
    ></div>

    <div class="relative flex items-center gap-3 font-display text-2xl font-semibold">
      <span class="grid size-11 place-items-center rounded-2xl bg-white/15 backdrop-blur">
        <svg lucideNotebookPen class="size-6" strokeWidth="1.8"></svg>
      </span>
      NoteKeeper
    </div>

    <div class="relative">
      <div class="relative mb-12 h-72">
        <div
          class="absolute top-0 left-4 w-56 -rotate-6 rounded-3xl border border-note-rose-line bg-note-rose p-5 text-ink shadow-lift"
        >
          <p class="font-display text-lg font-semibold">Ideias de viagem</p>
          <p class="mt-2 text-sm leading-6 text-ink-soft">Roteiro de 5 dias, reservar hospedagem.</p>
        </div>

        <div
          class="absolute top-10 right-6 w-52 rotate-3 rounded-3xl border border-note-butter-line bg-note-butter p-5 text-ink shadow-lift"
        >
          <p class="font-display text-lg font-semibold">Lista do mercado</p>
          <p class="mt-2 text-sm leading-6 text-ink-soft">Café, aveia, frutas e flores.</p>
        </div>

        <div
          class="absolute bottom-0 left-20 w-60 -rotate-2 rounded-3xl border border-note-mint-line bg-note-mint p-5 text-ink shadow-lift"
        >
          <p class="font-display text-lg font-semibold">Estudos de Angular</p>
          <div class="mt-3 flex gap-2">
            <span class="chip border-note-mint-line bg-white/60 text-ink-soft">
              <svg lucideTag class="size-3" aria-hidden="true"></svg> Estudos
            </span>
            <span class="chip border-note-mint-line bg-white/60 text-ink-soft">
              <svg lucideArchive class="size-3" aria-hidden="true"></svg> Guardada
            </span>
          </div>
        </div>
      </div>

      <h1 class="font-display text-4xl leading-tight font-semibold">
        Suas ideias, <br />organizadas com leveza.
      </h1>
      <p class="mt-4 max-w-md text-base leading-7 text-white/80">
        Registre anotações, agrupe por categorias e encontre tudo em segundos.
      </p>
    </div>
  </section>

  <section class="flex items-center justify-center px-5 py-10 sm:px-10">
    <div class="w-full max-w-md">
      <a
        routerLink="/auth/login"
        class="mb-10 inline-flex items-center gap-3 rounded-xl font-display text-xl font-semibold text-ink lg:hidden"
      >
        <span
          class="grid size-10 place-items-center rounded-xl bg-gradient-to-br from-orchid-400 to-orchid-700 text-white"
          aria-hidden="true"
        >
          <svg lucideNotebookPen class="size-5" strokeWidth="1.9"></svg>
        </span>
        Note<span class="-ml-2 text-orchid-600">Keeper</span>
      </a>

      <div class="rounded-[2rem] border border-line bg-white/85 p-7 shadow-lift backdrop-blur sm:p-9">
        <router-outlet></router-outlet>
      </div>
    </div>
  </section>
</main>
