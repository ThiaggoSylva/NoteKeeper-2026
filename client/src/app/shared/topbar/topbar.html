<header
  class="sticky top-0 z-30 flex h-16 items-center gap-2 border-b border-line bg-white/75 px-3 backdrop-blur-xl sm:gap-4 sm:px-5"
>
  <button
    type="button"
    class="botao-icone size-10"
    aria-label="Abrir ou fechar o menu"
    (click)="alternarMenu.emit()"
  >
    <svg lucideMenu class="size-5" aria-hidden="true"></svg>
  </button>

  <a
    routerLink="/notas"
    class="flex items-center gap-2.5 rounded-xl pr-2 font-display text-xl font-semibold tracking-tight text-ink"
  >
    <span
      class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-orchid-400 to-orchid-700 text-white shadow-soft"
      aria-hidden="true"
    >
      <svg lucideNotebookPen class="size-5" strokeWidth="1.9"></svg>
    </span>
    <span class="hidden sm:inline">Note<span class="text-orchid-600">Keeper</span></span>
  </a>

  @if (buscaVisivel()) {
    <div class="relative mx-auto min-w-0 max-w-xl flex-1">
      <label for="busca-topo" class="sr-only">Buscar notas</label>
      <svg
        lucideSearch
        class="pointer-events-none absolute top-1/2 left-4 size-4 -translate-y-1/2 text-ink-mute"
        aria-hidden="true"
      ></svg>

      <input
        id="busca-topo"
        type="search"
        autocomplete="off"
        placeholder="Buscar nas suas notas"
        class="w-full rounded-full border border-transparent bg-orchid-50 py-2.5 pr-11 pl-11 text-sm text-ink outline-none transition placeholder:text-ink-mute hover:bg-orchid-100/70 focus:border-orchid-300 focus:bg-white focus:ring-4 focus:ring-orchid-500/10 [&::-webkit-search-cancel-button]:hidden"
        [value]="buscaService.termo()"
        (input)="buscaService.definir($any($event.target).value)"
      />

      @if (buscaService.termo()) {
        <button
          type="button"
          class="botao-icone absolute top-1/2 right-1.5 size-8 -translate-y-1/2"
          aria-label="Limpar busca"
          (click)="buscaService.limpar()"
        >
          <svg lucideX class="size-4" aria-hidden="true"></svg>
        </button>
      }
    </div>
  } @else {
    <div class="flex-1"></div>
  }

  <div class="flex items-center gap-1 sm:gap-2">
    @if (usuario(); as usuario) {
      <div class="flex items-center gap-2.5 rounded-full py-1 pr-1 pl-1 sm:pr-3" [title]="usuario.email">
        <span
          class="grid size-9 place-items-center rounded-full bg-gradient-to-br from-note-peach to-note-lilac text-sm font-bold text-orchid-800 ring-2 ring-white"
          aria-hidden="true"
        >
          {{ inicial() }}
        </span>

        <span class="hidden max-w-[10rem] truncate text-sm font-semibold text-ink md:block">
          {{ usuario.nome }}
        </span>
      </div>
    }

    <button type="button" class="botao-suave px-3" (click)="sair()">
      <svg lucideLogOut class="size-4" aria-hidden="true"></svg>
      <span class="hidden sm:inline">Sair</span>
    </button>
  </div>
</header>
