@if (categorias().length === 0) {
  <p class="text-xs text-ink-mute">
    Você ainda não tem categorias. Crie em “Gerenciar categorias” para organizar suas notas.
  </p>
} @else {
  <ul class="flex flex-wrap gap-2" role="group" aria-label="Categorias da nota">
    @for (categoria of categorias(); track categoria.id) {
      <li>
        <button
          type="button"
          class="chip"
          [class]="
            selecionadas().includes(categoria.id)
              ? 'border-orchid-600 bg-orchid-600 text-white shadow-soft'
              : 'border-line bg-white/80 text-ink-soft hover:border-orchid-300 hover:bg-orchid-50'
          "
          [attr.aria-pressed]="selecionadas().includes(categoria.id)"
          (click)="alternar(categoria.id)"
        >
          @if (selecionadas().includes(categoria.id)) {
            <svg lucideCheck class="size-3.5" strokeWidth="2.5" aria-hidden="true"></svg>
          } @else {
            <svg lucideTag class="size-3.5" aria-hidden="true"></svg>
          }
          {{ categoria.titulo }}
        </button>
      </li>
    }
  </ul>
}
